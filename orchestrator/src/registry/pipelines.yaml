# Unified registry — one entry per pipeline, replacing the old
# registry/development/projects.yaml + registry/personal/projects.yaml
# split. Adding a pipeline is a new entry here, not new engine code — see
# pipeline-orchestrator's README for the full PipelineDefinition shape.

- name: busybuddy-dev
  handler: dev-ticket-pipeline
  # Dev-ticket-pipeline skills are actually resolved at runtime by the
  # reusable workflow's applies_to matching across all of skills/shared/dev/
  # (see dev-pipeline-reusable.yml's "Match shared skills" step) — this
  # deployment's skill_path is only used as the write target if
  # scaffold_pipeline is later used to regenerate this project's skill.
  # BusyBuddy_v2's real skill today is skills/shared/dev/project-conventions
  # (applies_to: all), written by hand before scaffold_pipeline existed.
  skill_path: skills/shared/dev/project-conventions
  execution:
    kind: github-actions
    workflow: dev-pipeline-reusable.yml
    owner: 11thandOrange
    repo: BusyBuddy_v2
  triggers:
    labels:
      approach-ready: plan
      approved: implement
    mentions:
      "@dev-agent plan": plan
      "@dev-agent implement": implement
  params:
    model_profile: implementation
    project_language: [typescript]
    test_command: "npm test -- --coverage"
    coverage_type: cobertura
    desired_coverage: 85
    reviewer: heyitschloe

- name: ordermate-dev
  handler: dev-ticket-pipeline
  skill_path: skills/shared/dev/android-conventions
  execution:
    kind: github-actions
    workflow: dev-pipeline-reusable.yml
    owner: 11thandOrange
    repo: OrderMate
  triggers:
    labels:
      approach-ready: plan
      approved: implement
    mentions:
      "@dev-agent plan": plan
      "@dev-agent implement": implement
  params:
    model_profile: implementation
    # Real command, confirmed against OrderMate's own agent docs
    # (.agents/agents/tester.md, build-release.md, ordermate-implementer.md)
    # and its actual app/build.gradle.kts dependencies: `./gradlew test`
    # runs the JVM unit test suite (JUnit 4.13.2 + androidx.test.ext/Espresso
    # for androidTest, which this does not run).
    test_command: "./gradlew test"
    # ASSUMPTION (no coverage tooling actually wired up in OrderMate today):
    # app/build.gradle.kts has no jacoco plugin applied, despite tester.md
    # referencing a `./gradlew testDebugUnitTest jacocoTestReport` task —
    # that task does not currently exist/work in this project. jacoco is
    # picked as the conventional choice for a JVM/Android project, but the
    # jacoco Gradle plugin and report wiring must be added to OrderMate's
    # build before this gate can actually run. desired_coverage is set low
    # (40) as a starting target given there is no existing coverage baseline.
    coverage_type: jacoco
    desired_coverage: 40
    project_language: [kotlin]
    reviewer: heyitschloe

- name: resume-job-applier
  handler: job-search-pipeline
  skill_path: skills/personal/resume-job-applier
  execution:
    kind: in-process
  triggers:
    chat_tool: run_personal_project_pipeline
    http_kind: personal
  params:
    model_profile: planning
    resume_source:
      mode: generated_pdf
    cover_letter_source:
      mode: generated_pdf
    sourcing_method: scraping
    strategy: scrapeOne
    max_results: 10
    search_provider: serpapi

# Automated web-scraping + outreach pipeline (issue #11). Like
# resume-job-applier this is one of THIS deployment's own private pipelines
# and runs in-process (the orchestrator itself scrapes, dedups, stores,
# generates, drafts, and notifies — there's no separate repo/CI runner to
# dispatch a build into). Execution is triggered daily by
# .github/workflows/outreach-daily.yml, which invokes the CLI entrypoint
# (scripts/run_outreach.ts) that dispatches this same handler; it can also be
# fired ad hoc over the generic HTTP path (http_kind: outreach) or the
# dedicated MCP tool. The vertical is config-driven (default "payment
# processors") so the whole pipeline is reusable for any outreach vertical
# without code changes.
- name: payment-processor-outreach
  handler: outreach-pipeline
  skill_path: skills/outreach/outreach-email
  execution:
    kind: in-process
  triggers:
    chat_tool: run_outreach_pipeline
    http_kind: outreach
  params:
    model_profile: planning
    vertical_label: payment processors
    search_terms:
      - payment processing companies
      - payment gateway providers
      - merchant services companies
      - payment service providers (PSP)
      - card acquiring / payment facilitator companies
    target_per_run: 25
    skill: outreach-email
    tone: warm, concise, professional
    cta: a brief 15-minute intro call
    # Sender identity is config, never hardcoded into a prompt — the skill
    # renders against these values. Real values come from GitHub Secrets /
    # env at deploy time; these are safe non-secret defaults/placeholders.
    sender:
      name: Chloe
      company: Agent-Ops
      role: Partnerships
      email: outreach@example.com
