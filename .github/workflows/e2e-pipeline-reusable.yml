name: e2e-pipeline-reusable

# Shared e2e test pipeline (BusyBuddy_v2#285 Phase 6). Lives here, once,
# centrally - each app repo keeps only a thin caller (see
# templates/e2e-pipeline-caller.yml) that passes its own install/test commands.
#
# Shared: checkout, artifact upload, PR comment, the record_video toggle, and the
# coverage requirement (tests exist and pass + every critical flow has a test,
# via a per-repo manifest). Repo-specific: which test framework actually runs
# (Playwright vs. Gradle/Espresso) - never hardcoded here, always an opaque
# input this workflow passes through without interpreting.
#
# needs_emulator exists because Android's instrumented tests aren't a "run a
# command" problem the way Playwright is - the emulator has to be booted and
# stay live for the whole test_command run, not just present beforehand. That's
# the one real branch point; everything else is identical between stacks.

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      install_command:
        description: Repo-specific setup (e.g. "npx playwright install chromium --with-deps"). Ignored when needs_emulator is true - the emulator-runner step handles its own setup.
        required: false
        type: string
        default: ""
      test_command:
        required: true
        type: string
      needs_emulator:
        description: True for Android/Espresso repos - runs test_command inside a live emulator session instead of as a bare step.
        required: false
        type: boolean
        default: false
      emulator_api_level:
        required: false
        type: number
        default: 30
      record_video:
        description: Capture video of the test run. Playwright repos get --video=on passed through PLAYWRIGHT_VIDEO; emulator repos get adb shell screenrecord wrapped around test_command.
        required: false
        type: boolean
        default: false
      capture_screenshots:
        description: Capture screenshots alongside video. Playwright repos get --screenshot=on passed through PLAYWRIGHT_SCREENSHOT; emulator repos get a screencap pulled after the run. Independent of record_video.
        required: false
        type: boolean
        default: false
      # ── Opt-in autogeneration + repair (agent-ops issue #10) ──
      # All default so existing install_command/test_command callers are
      # completely unchanged; the new e2e-autogen job only runs when
      # autogen is explicitly true.
      autogen:
        description: Opt-in. Detect framework, generate E2E specs, install, run, and bounded-repair on failure. When false (default) this workflow behaves exactly as before.
        required: false
        type: boolean
        default: false
      test_framework:
        description: Which test framework the autogen job generates for (playwright|cypress|jest|mocha). Ignored unless autogen is true; empty means detect.mjs decides.
        required: false
        type: string
        default: ""
      start_command:
        description: How the autogen job boots the app under test before running specs (e.g. "npm run dev"). Backgrounded; ignored unless autogen is true. Empty means no server is started (e.g. pure API tests hitting an external base_url).
        required: false
        type: string
        default: ""
      base_url:
        description: Base URL the generated specs target (exported as E2E_BASE_URL). Ignored unless autogen is true; empty means detect.mjs default.
        required: false
        type: string
        default: ""
      inventory_path:
        description: Path (relative to working_directory) to a JSON route/endpoint inventory feeding generation. Optional; generation still runs with an empty plan if absent.
        required: false
        type: string
        default: "e2e-inventory.json"
      max_repair_attempts:
        description: Upper bound on generate→install→test→regenerate cycles in the autogen job. Bounds CI spend. Ignored unless autogen is true.
        required: false
        type: number
        default: 3
      control_repo:
        description: owner/repo hosting this reusable workflow's scripts/ (detect/generate/scaffold + check-flow-coverage). Overridable so forks/renamed orgs don't hit a hardcoded value (agent-ops issue #10 / #1c).
        required: false
        type: string
        default: "11thandOrange/agent-ops"
      coverage_manifest_path:
        description: Path to this repo's critical-flow manifest (e.g. e2e-coverage.yaml) - a list of flow names that must each have a matching test. Empty string skips the check (repo hasn't adopted the manifest yet).
        required: false
        type: string
        default: ""
      node_version:
        required: false
        type: string
        default: "22"
    secrets:
      # Only consumed by the opt-in e2e-autogen job for the LiteLLM gateway
      # (same alias pattern as wiki-author.mjs). Both optional: generation is a
      # no-op / deterministic-fallback when unset, and existing non-autogen
      # callers never reference them. No provider SDK/key ever touches CI.
      LITELLM_PROXY_URL:
        required: false
      LITELLM_VIRTUAL_KEY:
        required: false

jobs:
  # ── Non-emulator path (Playwright, or any future non-Android e2e stack) ──
  e2e-tests:
    if: inputs.needs_emulator == false && inputs.autogen == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Run tests
        id: run
        env:
          PLAYWRIGHT_VIDEO: ${{ inputs.record_video && 'on' || 'off' }}
          PLAYWRIGHT_SCREENSHOT: ${{ inputs.capture_screenshots && 'on' || 'off' }}
        run: ${{ inputs.test_command }}
        working-directory: ${{ inputs.working_directory }}

      # Checked out separately, not part of the caller's own tree - this reusable
      # workflow's scripts/ live in agent-ops, same as skills do for
      # dev-pipeline-reusable.yml, just same-org here so no GH App token needed.
      # control_repo is parameterized (agent-ops issue #10 / #1c) rather than
      # hardcoded, so a fork/renamed org can point at its own copy.
      - name: Checkout agent-ops scripts
        if: inputs.coverage_manifest_path != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_repo }}
          path: .agent-ops-scripts

      - name: Coverage manifest check
        if: inputs.coverage_manifest_path != ''
        run: |
          cd .agent-ops-scripts/scripts && npm ci --omit=dev
          node check-flow-coverage.mjs "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/${{ inputs.coverage_manifest_path }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ${{ inputs.working_directory }}/test-results/**
          if-no-files-found: ignore

      - name: Upload video
        if: always() && inputs.record_video
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-video
          path: ${{ inputs.working_directory }}/test-results/**/*.webm
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always() && inputs.capture_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-screenshots
          path: ${{ inputs.working_directory }}/test-results/**/*.png
          if-no-files-found: ignore

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.run.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${icon} E2E Tests — ${status}\n\nSee the [CI run](${runUrl}) for details.`,
            });

  # ── Emulator path (Android/Espresso) ──
  e2e-tests-emulator:
    if: inputs.needs_emulator == true && inputs.autogen == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # avd-v2- (not avd-): the AVD created before this profile: line
          # existed defaulted to a bare 320x640 skin - no --device/profile
          # was ever passed to avdmanager, so it fell back to the smallest
          # generic screen. Real phones aren't 320px wide; confirmed on a
          # real CI run this made a normal-width header overflow off
          # screen entirely. A version bump on the cache key, not just
          # adding profile: below, since a previously-cached small-screen
          # AVD would otherwise still be reused as-is.
          key: avd-v2-${{ inputs.emulator_api_level }}

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator_api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      # reactivecircus/android-emulator-runner's `script:` input silently
      # truncates a multi-line if/fi script that backgrounds a process with
      # `&` - the pre-flight log shows the full script, but the shell that
      # actually runs it only receives the first line ("if ...; then") and
      # errors "unexpected end of file (expecting fi)". Confirmed on a real
      # run (OrderMate, agent-ops#5 follow-up). Writing the logic to a file
      # first and giving the action a single-line command instead sidesteps
      # whatever is truncating it, since only plain `run:` steps (not this
      # third-party action) ever see the multi-line/`&` content.
      - name: Write test runner script
        run: |
          cat > "$RUNNER_TEMP/run-emulator-tests.sh" <<'SCRIPT_EOF'
          #!/bin/sh
          RECORDER_PID=""
          if [ "$RECORD_VIDEO" = "true" ]; then
            adb shell screenrecord --time-limit 1800 /sdcard/e2e-test-run.mp4 &
            RECORDER_PID=$!
          fi

          eval "$TEST_COMMAND"
          TEST_EXIT=$?

          if [ -n "$RECORDER_PID" ]; then
            kill -INT "$RECORDER_PID" 2>/dev/null || true
            sleep 2
            adb pull /sdcard/e2e-test-run.mp4 ./e2e-test-run.mp4 || true
          fi

          # Screenshot capture (agent-ops issue #10, 3e): a final-state screencap
          # pulled after the run, independent of the video toggle. Non-fatal.
          if [ "$CAPTURE_SCREENSHOTS" = "true" ]; then
            adb shell screencap -p /sdcard/e2e-screenshot.png 2>/dev/null || true
            adb pull /sdcard/e2e-screenshot.png ./e2e-screenshot.png || true
          fi

          exit $TEST_EXIT
          SCRIPT_EOF
          chmod +x "$RUNNER_TEMP/run-emulator-tests.sh"

      # reactivecircus/android-emulator-runner's own boot sequence intermittently failed before
      # our script ever ran. Confirmed against the action's actual source
      # (emulator-manager.js, waitForDevice()/launchEmulator()): it polls
      # `adb shell getprop sys.boot_completed` until it reads "1", then on the very next line -
      # zero delay, no re-check - fires `adb shell input keyevent 82` to dismiss any lock
      # screen. sys.boot_completed=1 only means SystemServer finished its early-boot broadcast;
      # it doesn't guarantee every individual system service (InputManagerService here) has
      # finished registering with ServiceManager yet. Land in that gap and the keyevent throws
      # `IllegalStateException: ... No service published for: input`, erroring the whole step
      # out. That's a real race inside the action's compiled JS, with no input to disable the
      # nudge or add a grace period - retrying around it (tried first) is not a fix, just
      # gambling on the same race resolving next time, and it isn't reliable (confirmed: hit
      # twice in a row in practice). The actual fix is to not depend on the action's internal
      # handshake at all: launch the already-cached AVD (created by "Create AVD snapshot for
      # caching" above) ourselves, and explicitly wait for the input service to report ready
      # (`adb shell service check input`) before ever touching it - closing the race instead of
      # racing it repeatedly.
      # ~/.android/avd/* (cached above) only holds the AVD's own config/snapshot data - the SDK
      # packages an AVD launches against (the emulator binary itself, the system image files
      # under $ANDROID_HOME/system-images/, platform-tools for adb) live outside that path and
      # aren't part of the cache, so they're missing on every fresh runner regardless of AVD
      # cache hit/miss. The old action-based step reinstalled these on every single invocation
      # for exactly this reason - confirmed the hard way (`$ANDROID_HOME/emulator/emulator: No
      # such file or directory`) when this step's first version assumed they'd already be there.
      #
      # sdkmanager itself isn't on PATH either (confirmed against actions/runner-images' own
      # install-android-sdk.sh: it sets ANDROID_HOME/ANDROID_SDK_ROOT via /etc/environment but
      # never adds cmdline-tools/latest/bin, where sdkmanager actually lives, to PATH anywhere).
      # $GITHUB_PATH writes only take effect in later steps, not the current one, so this step
      # needs its own `export PATH=...` to use sdkmanager/adb within itself, in addition to the
      # $GITHUB_PATH lines so later steps (Launch emulator, Run tests, Terminate emulator) get
      # adb/emulator without repeating this.
      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install platform-tools "platforms;android-${{ inputs.emulator_api_level }}" > /dev/null
          sdkmanager --install emulator --channel=0 > /dev/null
          sdkmanager --install "system-images;android-${{ inputs.emulator_api_level }};google_apis;x86_64" --channel=0 > /dev/null

      - name: Launch emulator and wait for full boot
        run: |
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none &

          boot_timeout=600
          elapsed=0
          booted=""
          while [ -z "$booted" ]; do
            result="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')"
            if [ "$result" = "1" ]; then
              booted="1"
              echo "Emulator booted."
              break
            fi
            if [ "$elapsed" -ge "$boot_timeout" ]; then
              echo "Timeout waiting for emulator to boot." >&2
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          input_elapsed=0
          input_ready=""
          while [ -z "$input_ready" ]; do
            if adb -s emulator-5554 shell service check input 2>/dev/null | grep -q "found"; then
              input_ready="1"
              echo "input service ready."
              break
            fi
            if [ "$input_elapsed" -ge 60 ]; then
              echo "input service did not report ready within 60s, proceeding anyway." >&2
              break
            fi
            sleep 1
            input_elapsed=$((input_elapsed + 1))
          done

          # `service check input` reporting "found" only means ServiceManager has a binder
          # entry registered under that name - confirmed on a real run that the *actual*
          # InputManager.getInstance() call backing `adb shell input ...` can still throw
          # "No service published for: input" for a brief moment after that (~170ms observed),
          # while the service finishes its own internal binding. A few short retries closes
          # that final gap. This keyevent only dismisses a cosmetic lock screen our tests never
          # depend on either way, so a failure here is non-fatal (|| true) rather than blocking
          # the whole run over something that was never load-bearing.
          keyevent_ok=""
          for _ in 1 2 3 4 5; do
            if adb -s emulator-5554 shell input keyevent 82 2>/dev/null; then
              keyevent_ok="1"
              break
            fi
            sleep 1
          done
          [ -n "$keyevent_ok" ] || echo "input keyevent 82 did not succeed after retries, proceeding anyway." >&2

          adb -s emulator-5554 shell settings put global window_animation_scale 0.0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0.0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0.0

      - name: Run tests
        id: run
        working-directory: ${{ inputs.working_directory }}
        run: RECORD_VIDEO="${{ inputs.record_video }}" CAPTURE_SCREENSHOTS="${{ inputs.capture_screenshots }}" TEST_COMMAND="${{ inputs.test_command }}" sh "$RUNNER_TEMP/run-emulator-tests.sh"

      - name: Terminate emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true

      - name: Checkout agent-ops scripts
        if: inputs.coverage_manifest_path != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_repo }}
          path: .agent-ops-scripts

      - name: Coverage manifest check
        if: inputs.coverage_manifest_path != ''
        run: |
          cd .agent-ops-scripts/scripts && npm ci --omit=dev
          node check-flow-coverage.mjs "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/${{ inputs.coverage_manifest_path }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            ${{ inputs.working_directory }}/build/outputs/androidTest-results/**
            ${{ inputs.working_directory }}/build/reports/androidTests/**
          if-no-files-found: ignore

      - name: Upload video
        if: always() && inputs.record_video
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-video
          path: ${{ inputs.working_directory }}/e2e-test-run.mp4
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always() && inputs.capture_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-screenshots
          path: ${{ inputs.working_directory }}/e2e-screenshot.png
          if-no-files-found: ignore

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.run.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${icon} E2E Tests — ${status}\n\nSee the [CI run](${runUrl}) for details.`,
            });

  # ── Autogeneration + bounded repair path (agent-ops issue #10) ──
  # Opt-in via autogen: true. A brand-new repo (no tests/CI) gets: framework
  # detection → spec generation → dependency install → app boot → test run →
  # (on failure) feed logs back → regenerate → retry, bounded by
  # max_repair_attempts. Nothing here runs for existing install_command/
  # test_command callers (autogen defaults to false), so they're untouched.
  e2e-autogen:
    if: inputs.autogen == true && inputs.needs_emulator == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # This reusable workflow's own scripts/ (detect/generate/scaffold +
      # check-flow-coverage) live in control_repo, checked out separately from
      # the caller's tree. Parameterized, not hardcoded (issue #10 / #1c).
      - name: Checkout agent-ops scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_repo }}
          path: .agent-ops-scripts

      - name: Install agent-ops script deps
        run: cd .agent-ops-scripts/scripts && npm ci --omit=dev

      - name: Install app dependencies
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          else echo "No Node manifest found; skipping app dependency install."
          fi

      - name: Detect framework
        id: detect
        working-directory: ${{ inputs.working_directory }}
        run: |
          node "$GITHUB_WORKSPACE/.agent-ops-scripts/scripts/e2e/detect.mjs" . > "$RUNNER_TEMP/detection.json"
          echo "Detection:"; cat "$RUNNER_TEMP/detection.json"

      - name: Install test framework
        working-directory: ${{ inputs.working_directory }}
        env:
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
        run: |
          FW="$TEST_FRAMEWORK"
          if [ -z "$FW" ]; then FW="$(node -e "process.stdout.write(require('$RUNNER_TEMP/detection.json').testFramework||'playwright')")"; fi
          echo "Test framework: $FW"
          case "$FW" in
            playwright) npm i -D @playwright/test >/dev/null 2>&1 || true; npx playwright install chromium --with-deps ;;
            cypress)    npm i -D cypress >/dev/null 2>&1 || true ;;
            jest)       npm i -D jest >/dev/null 2>&1 || true ;;
            mocha)      npm i -D mocha >/dev/null 2>&1 || true ;;
          esac

      # generate → (start app) → test, retried up to max_repair_attempts. On
      # each failure the run log is fed back into generate.mjs so the model can
      # repair the spec; --allow-fallback guarantees a runnable artifact even
      # when the LiteLLM gateway is unset (no-op model), so the loop is always
      # bounded and never hangs waiting on generation.
      - name: Generate, run, and repair (bounded)
        id: run
        working-directory: ${{ inputs.working_directory }}
        env:
          LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
          LITELLM_VIRTUAL_KEY: ${{ secrets.LITELLM_VIRTUAL_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          START_COMMAND: ${{ inputs.start_command }}
          BASE_URL: ${{ inputs.base_url }}
          INVENTORY_PATH: ${{ inputs.inventory_path }}
          MAX_ATTEMPTS: ${{ inputs.max_repair_attempts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
          CAPTURE_SCREENSHOTS: ${{ inputs.capture_screenshots }}
        run: |
          set -u
          SCRIPTS="$GITHUB_WORKSPACE/.agent-ops-scripts/scripts/e2e"
          DET="$RUNNER_TEMP/detection.json"
          FW="$TEST_FRAMEWORK"
          [ -z "$FW" ] && FW="$(node -e "process.stdout.write(require('$DET').testFramework||'playwright')")"
          BURL="$BASE_URL"
          [ -z "$BURL" ] && BURL="$(node -e "process.stdout.write(require('$DET').baseUrl||'http://localhost:3000')")"
          export E2E_BASE_URL="$BURL"
          export PLAYWRIGHT_VIDEO=$([ "$RECORD_VIDEO" = "true" ] && echo on || echo off)
          export PLAYWRIGHT_SCREENSHOT=$([ "$CAPTURE_SCREENSHOTS" = "true" ] && echo on || echo off)

          INV=""
          if [ -n "$INVENTORY_PATH" ] && [ -f "$INVENTORY_PATH" ]; then INV="--inventory $INVENTORY_PATH"; fi

          # Boot the app under test once, if a start command was provided.
          SERVER_PID=""
          if [ -n "$START_COMMAND" ]; then
            echo "Starting app: $START_COMMAND"
            sh -c "$START_COMMAND" &
            SERVER_PID=$!
            for i in $(seq 1 30); do
              if curl -sSf -o /dev/null "$BURL" 2>/dev/null; then echo "App is up."; break; fi
              sleep 2
            done
          fi

          test_cmd() {
            case "$FW" in
              playwright) npx playwright test ;;
              cypress)    npx cypress run ;;
              jest)       npx jest ;;
              mocha)      npx mocha ;;
              *)          npx playwright test ;;
            esac
          }

          ATTEMPT=1
          RESULT=1
          LOG="$RUNNER_TEMP/e2e-run.log"
          : > "$LOG"
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Autogen attempt $ATTEMPT / $MAX_ATTEMPTS ==="
            FAIL_ARG=""
            if [ "$ATTEMPT" -gt 1 ]; then FAIL_ARG="--failure-log $LOG"; fi
            node "$SCRIPTS/generate.mjs" --repo-root . --detection "$DET" $INV \
              --framework "$FW" --allow-fallback --force $FAIL_ARG
            if test_cmd 2>&1 | tee "$LOG"; then
              echo "Tests passed on attempt $ATTEMPT."
              RESULT=0
              break
            fi
            echo "Tests failed on attempt $ATTEMPT."
            RESULT=1
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          exit $RESULT

      - name: Coverage manifest check
        if: always() && inputs.coverage_manifest_path != ''
        run: |
          cd .agent-ops-scripts/scripts
          node check-flow-coverage.mjs "$GITHUB_WORKSPACE/${{ inputs.working_directory }}/${{ inputs.coverage_manifest_path }}" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ${{ inputs.working_directory }}/test-results/**
          if-no-files-found: ignore

      - name: Upload video
        if: always() && inputs.record_video
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-video
          path: ${{ inputs.working_directory }}/test-results/**/*.webm
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always() && inputs.capture_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-screenshots
          path: ${{ inputs.working_directory }}/test-results/**/*.png
          if-no-files-found: ignore

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.run.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${icon} E2E Tests (autogen) — ${status}\n\nGenerated + repaired specs, bounded by max_repair_attempts. See the [CI run](${runUrl}) for details.`,
            });
