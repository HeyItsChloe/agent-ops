name: deploy-docs

# Builds agent-ops-docs/ and publishes it to GitHub Pages.
#
# Triggers on main, not a separate docs-site branch — the auto-created
# github-pages deployment environment restricts deployments to the
# default branch, so a separate branch's deploy job was rejected outright
# (zero steps, no logs — a hard environment-level reject, not a build
# failure). Folding docs-site into main sidesteps that rather than
# fighting the environment's branch-protection rule.
#
# One-time Pages setup before this can succeed: the repo's Pages build type
# must be "GitHub Actions" (Settings -> Pages -> Build and deployment ->
# Source). This is now automated (agent-ops issue #8, subtask 1b) — run it
# once at onboarding instead of clicking through the UI:
#
#   GITHUB_TOKEN=<token with pages:write> \
#     node scripts/setup/enable-pages.mjs --slug <owner>/<repo>
#
# The script is idempotent (no-op when already set). See
# docs/automation-audit.md for the full manual-step inventory.

on:
  push:
    branches: [main]
    paths:
      - "agent-ops-docs/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: agent-ops-docs
      - run: npm run build
        working-directory: agent-ops-docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: agent-ops-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
