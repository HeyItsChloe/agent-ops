# Reference template for the thin caller a managed repo needs to use
# e2e-pipeline-reusable.yml (BusyBuddy_v2#285 Phase 6). Two worked examples
# below - copy whichever matches the target repo's stack, delete the other.

name: e2e-pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_video:
        type: boolean
        default: false

jobs:
  # ── Example: Playwright (e.g. BusyBuddy_v2) ──
  playwright:
    permissions:
      contents: read
      pull-requests: write
    uses: 11thandOrange/agent-ops/.github/workflows/e2e-pipeline-reusable.yml@main
    with:
      working_directory: CHANGE_ME # e.g. extensions/bogo-shopify-app
      install_command: "npx playwright install chromium --with-deps"
      test_command: "npm run test:e2e"
      needs_emulator: false
      record_video: ${{ inputs.record_video || false }}
      coverage_manifest_path: e2e-coverage.yaml # omit/empty to skip the flow-coverage check

  # ── Example: Android/Espresso (e.g. OrderMate) ──
  # espresso:
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   uses: 11thandOrange/agent-ops/.github/workflows/e2e-pipeline-reusable.yml@main
  #   with:
  #     working_directory: app
  #     test_command: "./gradlew connectedDebugAndroidTest"
  #     needs_emulator: true
  #     emulator_api_level: 30
  #     record_video: ${{ inputs.record_video || false }}
  #     coverage_manifest_path: e2e-coverage.yaml

  # ── Example: brand-new repo, autogenerated + self-repairing (issue #10) ──
  # No install_command/test_command needed - the pipeline detects the
  # framework, generates specs, installs deps, boots the app, runs, and
  # repairs on failure (bounded). Opt-in via autogen: true; secrets optional
  # (generation is a no-op / deterministic fallback when the gateway is unset).
  # scripts/e2e/scaffold-caller.mjs --autogen writes exactly this shape.
  # autogen:
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   uses: 11thandOrange/agent-ops/.github/workflows/e2e-pipeline-reusable.yml@main
  #   with:
  #     working_directory: .
  #     autogen: true
  #     test_framework: playwright        # empty = auto-detected
  #     start_command: "npm run dev"      # boots the app under test
  #     base_url: "http://localhost:3000"
  #     max_repair_attempts: 3
  #     record_video: ${{ inputs.record_video || false }}
  #     capture_screenshots: ${{ inputs.record_video || false }}
  #     coverage_manifest_path: e2e-coverage.yaml
  #     control_repo: 11thandOrange/agent-ops   # now parameterized, not hardcoded
  #   secrets:
  #     LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
  #     LITELLM_VIRTUAL_KEY: ${{ secrets.LITELLM_VIRTUAL_KEY }}
